<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3f4f7">
  <!-- "Add to Home Screen" on iOS: opens full screen, like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="eClass">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>eClass — домашки, расписание, оценки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4L18.5 7.5"/></svg></span>
        <div>
          <h1>eClass</h1>
          <p class="today" id="today"></p>
        </div>
      </div>
      <nav class="tabs" aria-label="Разделы">
        <button type="button" data-tab="hw">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
          <span class="label">Домашки</span>
          <span class="badge" id="hw-count" hidden></span>
        </button>
        <button type="button" data-tab="schedule">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="label">Расписание</span>
        </button>
        <button type="button" data-tab="stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
          <span class="label">Статистика</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <p class="notice" id="notice" hidden></p>

    <form class="unlock" id="unlock" hidden>
      <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span>
      <h2>Данные под паролем</h2>
      <p>Задания, расписание и оценки на этом сайте зашифрованы. Введи пароль из секрета <code>DATA_PASSPHRASE</code> — на этом устройстве он запомнится.</p>
      <input class="visually-hidden" type="text" name="username" value="eclass-board" autocomplete="username" tabindex="-1" aria-hidden="true">
      <div class="unlock-row">
        <input type="password" id="unlock-pass" name="password" autocomplete="current-password" placeholder="Пароль" aria-label="Пароль" required>
        <button type="submit">Открыть</button>
      </div>
      <p class="unlock-error" id="unlock-error" role="alert" hidden></p>
    </form>

    <section id="panel-hw" aria-label="Домашки">
      <div class="hero" id="hw-hero"></div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Какие задачи показывать">
          <button type="button" data-filter="actual">Актуальные</button>
          <button type="button" data-filter="all">Все</button>
        </div>
      </div>
      <div id="hw-list"></div>
    </section>

    <section id="panel-schedule" aria-label="Расписание" hidden>
      <div id="schedule"></div>
    </section>

    <section id="panel-stats" aria-label="Статистика" hidden>
      <div id="stats"></div>
    </section>
  </main>

  <footer class="wrap status" id="status"></footer>

  <script src="app.js"></script>
</body>
</html>
